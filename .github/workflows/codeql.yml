name: CodeQL

# Skills runs the shared lane on itself; other repositories call `reusable-codeql.yml` at a release tag.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  schedule:
    - cron: '24 9 * * 3'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      languages: '["javascript-typescript", "actions"]'
