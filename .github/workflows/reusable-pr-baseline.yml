# Canonical non-product PR baseline for repositories consuming neo-agent-skills.
#
# Callers own only their event trigger and a published release: `uses: …@v0`, which follows every
# release, or an exact `@vX.Y.Z`. The `release-ref` job enforces it. This workflow owns the executable
# jobs, so adding another consumer does not copy any contract.
#
# REQUIRED CALLER TRIGGER — the `pr-body` job is only as good as the events the caller fires:
#
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, ready_for_review]
#
# `edited` is the one that is easy to omit and expensive to miss. This job reads the LIVE body, so a
# corrected body goes green with no push — but only if the caller fires on the edit. Without it the
# live fetch buys nothing: the author fixes the body, nothing re-runs, and the red stands until an
# unrelated commit arrives. `ready_for_review` re-judges a draft at the moment it becomes reviewable.
#
# The trigger cannot be asserted here — a reusable workflow does not see its caller's `on:` block.
# It is a caller obligation, tracked per repository under #14.

name: Reusable PR Baseline

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      required_base:
        description: Pull-request base branch accepted by the consumer repository.
        required: false
        type: string
        default: dev
      node_version:
        description: Node.js version used to install and verify the consumer lockfile.
        required: false
        type: string
        default: '24'
      team_roster_repository:
        description: >-
          Repository holding the caller team's roster module, which exports registryAgentLogins() and
          rosterEmailForLogin(login). Empty means no team, and the commit-authorship job checks no trailer.
        required: false
        type: string
        default: ''
      team_roster_ref:
        description: Ref the roster is read at. A branch of the roster repository, never the pull request under review.
        required: false
        type: string
        default: dev
      team_roster_path:
        description: Path of the roster module inside the roster repository.
        required: false
        type: string
        default: ''

jobs:
  # A caller names a published release by tag: `@v0`, the major tag tag-release moves to every release,
  # or an exact `@vX.Y.Z`. Never a SHA or a branch. Either way this workflow's own commit must be the
  # one `v${SKILLS_VERSION}` marks, so the npm version every job below installs is the release this
  # file was published as.
  release-ref:
    name: Release ref
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a caller that is not at a published release
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          SKILLS_VERSION: '0.1.20'
        run: |
          if [[ "${WORKFLOW_REF}" != *"@refs/tags/v"* ]]; then
            echo "Call ${WORKFLOW_REPOSITORY} at a release tag, @v${SKILLS_VERSION%%.*} or @v${SKILLS_VERSION}, never a SHA or a branch: not '${WORKFLOW_REF##*@}'."
            exit 1
          fi
          RELEASE_TAG="refs/tags/v${SKILLS_VERSION}"
          if ! RELEASE_REFS="$(git ls-remote "https://github.com/${WORKFLOW_REPOSITORY}.git" "${RELEASE_TAG}" "${RELEASE_TAG}^{}")"; then
            echo "Could not read ${WORKFLOW_REPOSITORY}'s tags to verify this release."
            exit 1
          fi
          RELEASE_SHA="$(awk -v tag="${RELEASE_TAG}^{}" '$2 == tag {print $1}' <<< "${RELEASE_REFS}")"
          RELEASE_SHA="${RELEASE_SHA:-$(awk -v tag="${RELEASE_TAG}" '$2 == tag {print $1}' <<< "${RELEASE_REFS}")}"
          if [[ -z "${RELEASE_SHA}" || "${WORKFLOW_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "Call ${WORKFLOW_REPOSITORY} at @v${SKILLS_VERSION%%.*} or @v${SKILLS_VERSION}, a published release, not '${WORKFLOW_REF##*@}' (${WORKFLOW_SHA:0:7})."
            exit 1
          fi

  pr-base:
    name: PR base
    runs-on: ubuntu-latest
    steps:
      - name: Reject a non-PR caller or the wrong base
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != inputs.required_base }}
        env:
          ACTUAL_BASE: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE: ${{ inputs.required_base }}
        run: |
          echo "Expected PR base '${EXPECTED_BASE}', observed '${ACTUAL_BASE:-not-a-pull-request}'."
          exit 1

  skills-materialized:
    name: Skills materialized
    runs-on: ubuntu-latest
    steps:
      # With no repository override, checkout resolves the caller repository. The reusable workflow
      # must inspect the consumer lockfile and projection, never its own source checkout.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install consumer dependencies
        run: npm ci

      - name: Assert skills are materialized and unshadowed
        run: npx --no-install neo-agent-skills-materialize --check

  source-comment-archaeology:
    name: Source comment archaeology
    runs-on: ubuntu-latest
    steps:
      - name: Reject a non-PR caller
        if: ${{ github.event_name != 'pull_request' }}
        run: exit 1

      - name: Checkout exact caller head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Fetch pull-request base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "${BASE_SHA}"

      - name: Install immutable archaeology guard
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-source-comment-archaeology
          SKILLS_VERSION: '0.1.20'
        run: >-
          npm install --prefix "${SKILLS_ROOT}" --ignore-scripts --package-lock=false --no-save
          "neo-agent-skills@${SKILLS_VERSION}"

      - name: Reject tracking and review archaeology
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-source-comment-archaeology
        run: >-
          "${SKILLS_ROOT}/node_modules/.bin/neo-agent-skills-ticket-archaeology"
          --base "${BASE_SHA}"

  substrate-size:
    name: Substrate size
    runs-on: ubuntu-latest
    steps:
      - name: Reject a non-PR caller
        if: ${{ github.event_name != 'pull_request' }}
        run: exit 1

      # The head tree is the whole input: this guard measures what a seat loads at this commit and
      # compares nothing against the base, so it needs no history.
      - name: Checkout exact caller head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      # The guard runs from runner.temp, never from the caller workspace. A checked-out copy would
      # be the same diff under review, so a pull request could widen the limit it is judged by, or
      # drop an entry from the target roster, and pass its own gate. The limit ships with the
      # pinned release; nothing on the command line can move it.
      - name: Install immutable substrate guard
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-substrate-size
          SKILLS_VERSION: '0.1.20'
        run: >-
          npm install --prefix "${SKILLS_ROOT}" --ignore-scripts --package-lock=false --no-save
          "neo-agent-skills@${SKILLS_VERSION}"

      # Measured against the checked-out caller tree. A repository carrying none of the substrate
      # entry points reports N/A and greens: three of the five consumers have no such files, and a
      # baseline they cannot adopt is not a baseline.
      #
      # `working-directory` is PINNED to the workflow-owned `github.workspace` and is load-bearing,
      # not tidiness. The guard resolves its root from cwd, and every target is ENOENT outside the
      # checkout — so a bare invocation from any other directory reports all-N/A and GREENS. Under
      # the negative-space contract a wrong root is indistinguishable from a legitimately empty
      # consumer, which makes the pin the only thing separating "nothing to measure" from "measured
      # nothing". Found by @neo-gpt in review; asserted by the workflow-contract suite.
      - name: Measure the per-turn substrate budget
        working-directory: ${{ github.workspace }}
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-substrate-size
        run: "${SKILLS_ROOT}/node_modules/.bin/neo-agent-skills-substrate-size"

  npm-overrides:
    name: npm overrides
    runs-on: ubuntu-latest
    steps:
      - name: Reject a non-PR caller
        if: ${{ github.event_name != 'pull_request' }}
        run: exit 1

      # The head's package.json and package-lock.json are the whole input. The verdict can only change
      # in a pull request that changes one of them, so it runs on every pull request without upstream
      # releases ever reddening one that touches neither.
      - name: Checkout exact caller head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      # From runner.temp, like the substrate guard: a checked-out copy is the diff under review, so a
      # pull request could relax the verdicts it is judged by.
      - name: Install immutable npm-overrides guard
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-npm-overrides
          SKILLS_VERSION: '0.1.20'
        run: >-
          npm install --prefix "${SKILLS_ROOT}" --ignore-scripts --package-lock=false --no-save
          "neo-agent-skills@${SKILLS_VERSION}"

      # Pinned and invoked bare: any other directory, or a `--root`, can point the guard at a nested
      # package.json that is not the consumer's, and judge that manifest instead.
      - name: Judge every override against the ranges its dependents declare
        working-directory: ${{ github.workspace }}
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-npm-overrides
        run: "${SKILLS_ROOT}/node_modules/.bin/neo-agent-skills-npm-overrides"

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Reject a non-PR caller
        if: ${{ github.event_name != 'pull_request' }}
        run: exit 1

      # Every tracked file at the head is the input, not only the diff: a credential already on the base still
      # fails, because it is one to revoke whichever pull request finds it.
      - name: Checkout exact caller head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      # From runner.temp, like the substrate guard: a checked-out copy is the diff under review, so a pull request
      # could relax the patterns it is judged by.
      - name: Install immutable credential guard
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-secrets
          SKILLS_VERSION: '0.1.20'
        run: >-
          npm install --prefix "${SKILLS_ROOT}" --ignore-scripts --package-lock=false --no-save
          "neo-agent-skills@${SKILLS_VERSION}"

      # Pinned to the checkout and given only `--all`: `git ls-files` there is the caller's whole tree, and a
      # file list or another directory would scan less of it.
      - name: Scan every tracked file for credential-shaped literals
        working-directory: ${{ github.workspace }}
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-secrets
        run: >-
          "${SKILLS_ROOT}/node_modules/.bin/neo-agent-skills-secrets"
          --all

  commit-authorship:
    name: Commit authorship
    runs-on: ubuntu-latest
    steps:
      - name: Reject a non-PR caller
        if: ${{ github.event_name != 'pull_request' }}
        run: exit 1

      # The commits the pull request adds are the input, so the history from its base to its head
      - name: Checkout exact caller head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch pull-request base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "${BASE_SHA}"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      # From runner.temp, like the substrate guard: a checked-out copy is the diff under review, so a pull request
      # could relax the checks it is judged by.
      - name: Install immutable authorship guard
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-commit-authorship
          SKILLS_VERSION: '0.1.20'
        run: >-
          npm install --prefix "${SKILLS_ROOT}" --ignore-scripts --package-lock=false --no-save
          "neo-agent-skills@${SKILLS_VERSION}"

      # The roster says who the caller's team is, so it is read from the roster repository at the caller's ref and
      # never from the pull request: a diff that could edit the roster could add its own author to the team.
      - name: Checkout the team roster
        if: ${{ inputs.team_roster_repository != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.team_roster_repository }}
          ref: ${{ inputs.team_roster_ref }}
          path: .team-roster

      # The PR author is the GitHub-authenticated login, which no commit in the pull request can forge, so it decides
      # whether these commits are an agent's. Without a roster the guard says there is no team to check.
      - name: Check the authorship of every commit the pull request adds
        working-directory: ${{ github.workspace }}
        env:
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ROSTER: ${{ inputs.team_roster_repository != '' && format('.team-roster/{0}', inputs.team_roster_path) || '' }}
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-commit-authorship
        run: |
          args=(--base "${BASE_SHA}" --author-login "${AUTHOR_LOGIN}")
          [ -n "${ROSTER}" ] && args+=(--roster "${ROSTER}")
          "${SKILLS_ROOT}/node_modules/.bin/neo-agent-skills-commit-authorship" "${args[@]}"

  pr-body:
    name: PR body
    runs-on: ubuntu-latest
    # The top-level grant is `contents: read`; this job needs the pull request itself. Declared here
    # rather than widened globally, so the other three jobs keep the narrower grant.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Reject a non-PR caller
        if: ${{ github.event_name != 'pull_request' }}
        run: exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      # No checkout, deliberately. This job's whole input is the pull-request body, so the tree under
      # review never enters it — a diff cannot weaken the gate that judges it, and there is nothing
      # for a caller to shadow. The other jobs check out because they measure the tree; this one does
      # not measure the tree.
      - name: Install immutable PR-body guard
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-pr-body
          SKILLS_VERSION: '0.1.20'
        run: >-
          npm install --prefix "${SKILLS_ROOT}" --ignore-scripts --package-lock=false --no-save
          "neo-agent-skills@${SKILLS_VERSION}"

      # The body is fetched LIVE, never read from `context.payload.pull_request.body`. An event
      # snapshot is wrong in both directions: a re-run replays the stale text, so a corrected body can
      # never go green, and a body edited after a green run keeps that green. Recorded as
      # `neomjs/neo#17431`, whose fix lived only in the workflow the split deleted.
      #
      # It is written to a FILE from JavaScript and never interpolated into a shell. A pull-request
      # body is attacker-controlled text; `run:` steps below receive only a workflow-owned path.
      #
      # Two claims, two scopes. The close target is repository policy for EVERY pull request a person
      # or agent opens, draft or ready: it resolves exactly one ticket. A GitHub App's pull request
      # (dependabot's) resolves none, so a step reports it unjudged instead. The anchors are §9, the AGENT
      # protocol, so they judge only a `neo-` login or an `ai`-labelled PR; holding a human PR to that
      # template would be a policy nobody agreed to. The anchor step is gated rather than the job, so
      # the check still REPORTS on a human PR — a skipped job cannot serve as the required status
      # context #14 needs.
      - name: Read the live pull-request body
        uses: actions/github-script@v9
        env:
          BODY_FILE: ${{ runner.temp }}/pr-body.md
        with:
          script: |
            const {data} = await github.rest.pulls.get({
                owner      : context.repo.owner,
                repo       : context.repo.repo,
                pull_number: context.payload.pull_request.number
            });

            require('node:fs').writeFileSync(process.env.BODY_FILE, data.body ?? '');

      - name: Validate the close target
        if: ${{ github.event.pull_request.user.type != 'Bot' }}
        env:
          BODY_FILE  : ${{ runner.temp }}/pr-body.md
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-pr-body
        run: >-
          "${SKILLS_ROOT}/node_modules/.bin/neo-agent-skills-pr-body"
          --body-file "${BODY_FILE}" --close-target-only

      - name: Report a bot's unjudged close target
        if: ${{ github.event.pull_request.user.type == 'Bot' }}
        env:
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: >-
          echo "${AUTHOR_LOGIN} is a GitHub App, whose pull request resolves no ticket,
          so its close target is not judged."

      - name: Validate the required anchors
        if: ${{ startsWith(github.event.pull_request.user.login, 'neo-') || contains(github.event.pull_request.labels.*.name, 'ai') }}
        env:
          BODY_FILE  : ${{ runner.temp }}/pr-body.md
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-pr-body
        run: >-
          "${SKILLS_ROOT}/node_modules/.bin/neo-agent-skills-pr-body"
          --body-file "${BODY_FILE}"
