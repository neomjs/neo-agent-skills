# Canonical non-product PR baseline for repositories consuming neo-agent-skills.
#
# Callers own only their event trigger and immutable `uses:` coordinate. This workflow owns the
# executable jobs, so adding another consumer does not copy any contract.

name: Reusable PR Baseline

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      required_base:
        description: Pull-request base branch accepted by the consumer repository.
        required: false
        type: string
        default: dev
      node_version:
        description: Node.js version used to install and verify the consumer lockfile.
        required: false
        type: string
        default: '24'

jobs:
  pr-base:
    name: PR base
    runs-on: ubuntu-latest
    steps:
      - name: Reject a non-PR caller or the wrong base
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != inputs.required_base }}
        env:
          ACTUAL_BASE: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE: ${{ inputs.required_base }}
        run: |
          echo "Expected PR base '${EXPECTED_BASE}', observed '${ACTUAL_BASE:-not-a-pull-request}'."
          exit 1

  skills-materialized:
    name: Skills materialized
    runs-on: ubuntu-latest
    steps:
      # With no repository override, checkout resolves the caller repository. The reusable workflow
      # must inspect the consumer lockfile and projection, never its own source checkout.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install consumer dependencies
        run: npm ci

      - name: Assert skills are materialized and unshadowed
        run: npx --no-install neo-agent-skills-materialize --check

  source-comment-archaeology:
    name: Source comment archaeology
    runs-on: ubuntu-latest
    steps:
      - name: Reject a non-PR caller
        if: ${{ github.event_name != 'pull_request' }}
        run: exit 1

      - name: Checkout exact caller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Fetch pull-request base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "${BASE_SHA}"

      - name: Install immutable archaeology guard
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-source-comment-archaeology
          SKILLS_VERSION: '0.1.2'
        run: >-
          npm install --prefix "${SKILLS_ROOT}" --ignore-scripts --package-lock=false --no-save
          "neo-agent-skills@${SKILLS_VERSION}"

      - name: Reject tracking and review archaeology
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-source-comment-archaeology
        run: >-
          "${SKILLS_ROOT}/node_modules/.bin/neo-agent-skills-ticket-archaeology"
          --base "${BASE_SHA}"

  substrate-size:
    name: Substrate size
    runs-on: ubuntu-latest
    steps:
      - name: Reject a non-PR caller
        if: ${{ github.event_name != 'pull_request' }}
        run: exit 1

      # The head tree is the whole input: this guard measures what a seat loads at this commit and
      # compares nothing against the base, so it needs no history.
      - name: Checkout exact caller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      # The guard runs from runner.temp, never from the caller workspace. A checked-out copy would
      # be the same diff under review, so a pull request could widen the limit it is judged by, or
      # drop an entry from the target roster, and pass its own gate. The limit ships with the
      # pinned release; nothing on the command line can move it.
      - name: Install immutable substrate guard
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-substrate-size
          SKILLS_VERSION: '0.1.2'
        run: >-
          npm install --prefix "${SKILLS_ROOT}" --ignore-scripts --package-lock=false --no-save
          "neo-agent-skills@${SKILLS_VERSION}"

      # Measured against the checked-out caller tree. A repository carrying none of the substrate
      # entry points reports N/A and greens: three of the five consumers have no such files, and a
      # baseline they cannot adopt is not a baseline.
      #
      # `working-directory` is PINNED to the workflow-owned `github.workspace` and is load-bearing,
      # not tidiness. The guard resolves its root from cwd, and every target is ENOENT outside the
      # checkout — so a bare invocation from any other directory reports all-N/A and GREENS. Under
      # the negative-space contract a wrong root is indistinguishable from a legitimately empty
      # consumer, which makes the pin the only thing separating "nothing to measure" from "measured
      # nothing". Found by @neo-gpt in review; asserted by the workflow-contract suite.
      - name: Measure the per-turn substrate budget
        working-directory: ${{ github.workspace }}
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-substrate-size
        run: "${SKILLS_ROOT}/node_modules/.bin/neo-agent-skills-substrate-size"

  pr-body:
    name: PR body
    runs-on: ubuntu-latest
    # The top-level grant is `contents: read`; this job needs the pull request itself. Declared here
    # rather than widened globally, so the other three jobs keep the narrower grant.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Reject a non-PR caller
        if: ${{ github.event_name != 'pull_request' }}
        run: exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      # No checkout, deliberately. This job's whole input is the pull-request body, so the tree under
      # review never enters it — a diff cannot weaken the gate that judges it, and there is nothing
      # for a caller to shadow. The other jobs check out because they measure the tree; this one does
      # not measure the tree.
      - name: Install immutable PR-body guard
        env:
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-pr-body
          SKILLS_VERSION: '0.1.2'
        run: >-
          npm install --prefix "${SKILLS_ROOT}" --ignore-scripts --package-lock=false --no-save
          "neo-agent-skills@${SKILLS_VERSION}"

      # The body is fetched LIVE, never read from `context.payload.pull_request.body`. An event
      # snapshot is wrong in both directions: a re-run replays the stale text, so a corrected body can
      # never go green, and a body edited after a green run keeps that green. Recorded as
      # `neomjs/neo#17431`, whose fix lived only in the workflow the split deleted.
      #
      # It is written to a FILE from JavaScript and never interpolated into a shell. A pull-request
      # body is attacker-controlled text; `run:` steps below receive only a workflow-owned path.
      - name: Read the live pull-request body
        uses: actions/github-script@v7
        env:
          BODY_FILE: ${{ runner.temp }}/pr-body.md
        with:
          script: |
            const {data} = await github.rest.pulls.get({
                owner      : context.repo.owner,
                repo       : context.repo.repo,
                pull_number: context.payload.pull_request.number
            });

            require('node:fs').writeFileSync(process.env.BODY_FILE, data.body ?? '');

            // Resolved here so the shell never branches on it: a draft may defer its close target,
            // and `${VAR:+--draft}` would pass the flag for the string "false" too.
            core.exportVariable('DRAFT_FLAG', data.draft ? '--draft' : '')

      - name: Validate the required anchors
        env:
          BODY_FILE  : ${{ runner.temp }}/pr-body.md
          SKILLS_ROOT: ${{ runner.temp }}/neo-agent-skills-pr-body
        run: >-
          "${SKILLS_ROOT}/node_modules/.bin/neo-agent-skills-pr-body"
          --body-file "${BODY_FILE}" ${DRAFT_FLAG}
