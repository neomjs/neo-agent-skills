# Hands a Dependabot pull request to GitHub's auto-merge: by default every one, majors included, or only the
# dependencies and update types a caller lists. GitHub then merges it once the base branch's required status
# checks pass, so "green" means what the repository's ruleset requires. Nothing here merges by itself, and
# no agent runs `gh pr merge` (critical gate 1's machine-merge line).
#
# Callers own the trigger, the permissions and a published release tag:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     automerge:
#       uses: neomjs/neo-agent-skills/.github/workflows/reusable-dependabot-automerge.yml@vX.Y.Z
#
# Both jobs run one script each from this workflow's own commit. `eligibility` decides from the event.
# `handoff` reads the repository live and arms only when "Allow auto-merge" is on, the base branch's rulesets
# require a status check, and the head is still the admitted commit. A failed read turns `handoff` red and
# arms nothing (scripts/dependabot-automerge-handoff.mjs). Every event decides afresh: a Dependabot pull
# request that stops being eligible, for example after another account pushes to it, loses the auto-merge
# this workflow armed. `NEO_AUTOMERGE_DEPENDABOT=off` stops new armings and takes back each armed pull request
# at its next event.
#
# A merge GitHub performs for this workflow's token starts no `push` workflow runs on the base branch
# (GitHub's GITHUB_TOKEN rule). The pull request's own required checks are the evidence; the next merged
# pull request's push runs catch up.

name: Reusable Dependabot Auto-Merge

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      dependency_allow_list:
        description: Comma-separated dependency names a Dependabot pull request may update and still merge itself, or `*` for any.
        required: false
        type: string
        default: '*'
      update_types:
        description: Comma-separated semver update types (patch, minor, major) that may merge themselves, or `*` for any.
        required: false
        type: string
        default: '*'
      merge_method:
        description: How GitHub merges once the required checks pass (squash, merge or rebase).
        required: false
        type: string
        default: squash

jobs:
  eligibility:
    name: Eligibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.decide.outputs.eligible }}
      disarm: ${{ steps.decide.outputs.disarm }}
      reason: ${{ steps.decide.outputs.reason }}
      head: ${{ github.event.pull_request.head.sha }}
    steps:
      # Read on Dependabot's own events only. After another account's push the decision refuses on the sender,
      # and fetch-metadata fails when that push replaced Dependabot's commit, which would stop the take-back.
      # A pull request it cannot parse still reaches the decision: `*` admits it, and a caller's list refuses it.
      - name: Read the update
        id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.sender.login == 'dependabot[bot]'
        continue-on-error: true
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ github.token }}

      # The decision runs from this workflow's own commit, never from the pull request's head:
      # `job.workflow_*` name this reusable file's repository and commit; `github.*` would name the caller's.
      - name: Checkout this workflow's decision
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .neo-agent-skills
          sparse-checkout: scripts/dependabot-automerge-eligibility.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Decide
        id: decide
        env:
          AUTOMERGE_AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTOMERGE_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          AUTOMERGE_SENDER: ${{ github.event.sender.login }}
          AUTOMERGE_DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          AUTOMERGE_UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          AUTOMERGE_ALLOW_LIST: ${{ inputs.dependency_allow_list }}
          AUTOMERGE_UPDATE_TYPES: ${{ inputs.update_types }}
          AUTOMERGE_KILL_SWITCH: ${{ vars.NEO_AUTOMERGE_DEPENDABOT }}
        run: node .neo-agent-skills/scripts/dependabot-automerge-eligibility.mjs

  handoff:
    name: Hand off to auto-merge
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true' || needs.eligibility.outputs.disarm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout this workflow's handoff
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .neo-agent-skills
          sparse-checkout: scripts/dependabot-automerge-handoff.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Arm or take back auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMERGE_REPOSITORY: ${{ github.repository }}
          AUTOMERGE_PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTOMERGE_ADMITTED_HEAD: ${{ needs.eligibility.outputs.head }}
          AUTOMERGE_ELIGIBLE: ${{ needs.eligibility.outputs.eligible }}
          AUTOMERGE_DISARM: ${{ needs.eligibility.outputs.disarm }}
          AUTOMERGE_MERGE_METHOD: ${{ inputs.merge_method }}
        run: node .neo-agent-skills/scripts/dependabot-automerge-handoff.mjs
